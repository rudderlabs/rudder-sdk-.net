name: Release Verification Tests
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    types: ['opened', 'reopened', 'synchronize']
    paths-ignore:
    - 'README.md'

permissions:
  contents: read

jobs:
  test_release_verification:
    name: Test release verification
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        persist-credentials: false

    - name: Install workflow test parser
      run: python3 -m pip install 'PyYAML==6.0.2'

    - name: Test release provenance, ordering and NuGet verification without publishing
      run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
