---
name: Publish NuGet Package

"on":
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-ref:
    name: Validate publish ref
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Confirm manual dispatch ref
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            exit 0
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            exit 0
          fi

          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            exit 0
          fi

          echo "Manual publishing is only allowed from tags or master."
          exit 1

  pack:
    name: Pack RudderAnalytics
    needs: validate-ref
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: >-
          step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 5.0.x

      - name: Restore dependencies
        run: dotnet restore RudderAnalytics/RudderAnalytics.csproj

      - name: Build
        run: >-
          dotnet build RudderAnalytics/RudderAnalytics.csproj
          --configuration Release
          --no-restore

      - name: Pack
        run: >-
          dotnet pack RudderAnalytics/RudderAnalytics.csproj
          --configuration Release
          --no-build
          --output artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rudderanalytics-nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish RudderAnalytics to NuGet
    needs: pack
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download package artifact
        # actions/download-artifact v4.3.0
        uses: >-
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rudderanalytics-nuget-package
          path: artifacts

      - name: Authenticate to NuGet
        id: login
        # NuGet/login v1.2.0 performs the Trusted Publishing OIDC exchange.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -Path artifacts -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one NuGet package in artifacts; found $($packages.Count)."
          }

          $packagePath = $packages[0].FullName
          dotnet nuget push "$packagePath" `
            --source https://api.nuget.org/v3/index.json `
            --api-key "$env:NUGET_API_KEY" `
            --skip-duplicate
          exit $LASTEXITCODE

  verify-and-notify:
    name: Verify NuGet availability and notify Slack
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout the workflow commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify the exact package on NuGet
        id: verify
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/verify_nuget_release.py

      - name: Prepare release notification
        if: github.event_name == 'release'
        env:
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
          RELEASE_VERSION: ${{ steps.verify.outputs.version }}
        run: |
          jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg version "$RELEASE_VERSION" \
            '{channel: $channel, text: (".NET SDK " + $version + " is available on NuGet: <https://www.nuget.org/packages/RudderAnalytics/" + $version + "|RudderAnalytics " + $version + ">\n<https://github.com/rudderlabs/rudder-sdk-.net/releases/tag/v" + $version + "|Release notes>\nCC: <!subteam^S03SW7DM8P3>"), unfurl_links: false, unfurl_media: false}' \
            > "$RUNNER_TEMP/nuget-release-notification.json"

      - name: Notify Slack of verified NuGet publication
        if: github.event_name == 'release'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          retries: rapid
          payload-file-path: ${{ runner.temp }}/nuget-release-notification.json
