---
name: Publish NuGet Package

"on":
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-ref:
    name: Validate publish ref
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Confirm manual dispatch ref
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            exit 0
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            exit 0
          fi

          echo "Manual publishing requires an existing release tag. Use published-sdk-e2e.yml to retry validation."
          exit 1

  pack:
    name: Pack RudderAnalytics
    needs: validate-ref
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: >-
          step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 5.0.x

      - name: Restore dependencies
        run: dotnet restore RudderAnalytics/RudderAnalytics.csproj

      - name: Build
        run: >-
          dotnet build RudderAnalytics/RudderAnalytics.csproj
          --configuration Release
          --no-restore

      - name: Pack
        run: >-
          dotnet pack RudderAnalytics/RudderAnalytics.csproj
          --configuration Release
          --no-build
          --output artifacts

      - name: Check packed version matches the release tag
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one package.' }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $entry = @($archive.Entries | Where-Object FullName -like '*.nuspec')
            if ($entry.Count -ne 1) { throw 'Expected exactly one package manifest.' }
            $reader = [System.IO.StreamReader]::new($entry[0].Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $version = $manifest.package.metadata.version
            if ($env:GITHUB_REF_NAME -cne "v$version") {
              throw 'Packed package version does not match the selected release tag.'
            }
          } finally { $archive.Dispose() }

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rudderanalytics-nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish RudderAnalytics to NuGet
    needs: pack
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download package artifact
        # actions/download-artifact v4.3.0
        uses: >-
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rudderanalytics-nuget-package
          path: artifacts

      - name: Authenticate to NuGet
        id: login
        # NuGet/login v1.2.0 performs the Trusted Publishing OIDC exchange.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -Path artifacts -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one NuGet package in artifacts; found $($packages.Count)."
          }

          $packagePath = $packages[0].FullName
          dotnet nuget push "$packagePath" `
            --source https://api.nuget.org/v3/index.json `
            --api-key "$env:NUGET_API_KEY" `
            --skip-duplicate
          exit $LASTEXITCODE

  verify-publication:
    name: Verify NuGet availability
    outputs:
      version: ${{ steps.verify.outputs.version }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout the workflow commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify the exact package on NuGet
        id: verify
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: python3 .github/scripts/verify_nuget_release.py


  published-e2e:
    name: Accept exact published package
    needs: verify-publication
    permissions:
      contents: read
    uses: ./.github/workflows/published-sdk-e2e.yml
    with:
      package-version: ${{ needs.verify-publication.outputs.version }}
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  notify-slack:
    name: Report NuGet release acceptance
    needs: [publish, verify-publication, published-e2e]
    if: ${{ always() && github.event_name == 'release' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Record publication and acceptance separately
        env:
          PUBLIC_VERIFICATION: ${{ needs.verify-publication.result }}
          ACCEPTANCE_RESULT: ${{ needs.published-e2e.result }}
        run: |
          echo "NuGet upload completed. Public verification: $PUBLIC_VERIFICATION. Published-package E2E: $ACCEPTANCE_RESULT." >> "$GITHUB_STEP_SUMMARY"
          echo 'The package remains published if acceptance fails. Retry published-sdk-e2e.yml at the same release tag.' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release notification
        if: needs.verify-publication.result == 'success' && needs.published-e2e.result == 'success'
        env:
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
          RELEASE_VERSION: ${{ needs.verify-publication.outputs.version }}
        run: |
          jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg version "$RELEASE_VERSION" \
            '{channel: $channel, text: (".NET SDK " + $version + " is available on NuGet: <https://www.nuget.org/packages/RudderAnalytics/" + $version + "|RudderAnalytics " + $version + ">\n<https://github.com/rudderlabs/rudder-sdk-.net/releases/tag/v" + $version + "|Release notes>\nCC: <!subteam^S03SW7DM8P3>"), unfurl_links: false, unfurl_media: false}' \
            > "$RUNNER_TEMP/nuget-release-notification.json"

      - name: Notify Slack of verified NuGet publication
        if: needs.verify-publication.result == 'success' && needs.published-e2e.result == 'success'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          retries: rapid
          payload-file-path: ${{ runner.temp }}/nuget-release-notification.json
