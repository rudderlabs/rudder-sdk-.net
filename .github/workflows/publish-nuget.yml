---
name: Publish NuGet Package

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: Publish the tagged release or validate its exact public package without uploading
        required: true
        type: choice
        options: [publish, validate-only]
      release_tag:
        description: Published GitHub release tag (vX.Y.Z); execute this workflow on master
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

# Never cancel acceptance while the central runner owns live locks or cleanup.
concurrency:
  group: nuget-release-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate-ref:
    name: Resolve published release and origin commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout release validation code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Resolve published release tag, version and commit
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: python3 .github/scripts/resolve_nuget_release.py

  pack:
    name: Pack RudderAnalytics
    needs: validate-ref
    if: github.event_name == 'release' || inputs.mode == 'publish'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: >-
          step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate-ref.outputs.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 5.0.x

      - name: Restore dependencies
        run: dotnet restore RudderAnalytics/RudderAnalytics.csproj

      - name: Build
        run: >-
          dotnet build RudderAnalytics/RudderAnalytics.csproj
          --configuration Release
          --no-restore

      - name: Pack
        run: >-
          dotnet pack RudderAnalytics/RudderAnalytics.csproj
          --configuration Release
          --no-build
          --output artifacts

      - name: Confirm packed artifact matches the published release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate-ref.outputs.version }}
        run: |
          $packages = @(Get-ChildItem -Path artifacts -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1 -or $packages[0].Name -cne "RudderAnalytics.$env:RELEASE_VERSION.nupkg") {
            throw 'Packed artifact does not match the exact published release version.'
          }

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rudderanalytics-nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish RudderAnalytics to NuGet
    needs: [validate-ref, pack]
    if: github.event_name == 'release' || inputs.mode == 'publish'
    runs-on: windows-2022
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download package artifact
        # actions/download-artifact v4.3.0
        uses: >-
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rudderanalytics-nuget-package
          path: artifacts

      - name: Authenticate to NuGet
        id: login
        # NuGet/login v1.2.0 performs the Trusted Publishing OIDC exchange.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -Path artifacts -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one NuGet package in artifacts; found $($packages.Count)."
          }

          $packagePath = $packages[0].FullName
          dotnet nuget push "$packagePath" `
            --source https://api.nuget.org/v3/index.json `
            --api-key "$env:NUGET_API_KEY" `
            --skip-duplicate
          exit $LASTEXITCODE

  verify:
    name: Verify exact public NuGet package
    needs: [validate-ref, publish]
    if: >-
      always() && needs.validate-ref.result == 'success' &&
      (needs.publish.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'validate-only' &&
        needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Run the verifier from the executing workflow, not from an older release
      # tag whose commit may lack the script or its exact-version guard.
      - name: Checkout release verification code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify the exact package on NuGet
        id: verify
        env:
          RELEASE_TAG: ${{ needs.validate-ref.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.validate-ref.outputs.version }}
        run: python3 .github/scripts/verify_nuget_release.py

  accept-published:
    name: Full published-package E2E delivery and cleanup acceptance
    needs: [validate-ref, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # SDK-5961/SDK-5962: do not dispatch an auto/source candidate instead of
      # exact published mode. Replace this guard only after the reviewed shared
      # action SHA is on main and package-version + origin SHA are supported.
      - name: Require exact published-mode shared action before dispatch
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_SHA: ${{ needs.validate-ref.outputs.sha }}
        run: |
          echo "Published RudderAnalytics $RELEASE_VERSION ($RELEASE_SHA) is verified on NuGet, but exact full E2E acceptance requires SDK-5961/SDK-5962." >&2
          exit 1

      # RESOLVE: Replace with the reviewed full SHA of rudderlabs/github-action-sdk-e2e
      # after SDK-5961/SDK-5962 merge; pass suite: full, package-version:
      # needs.verify.outputs.version, and the resolved release SHA per its interface.
      # Mint a token here (not in PR checks): owner: rudderlabs,
      # repositories: rudder-sdk-e2e-tests, permission-actions: write, using
      # vars.RELEASE_APP_CLIENT_ID and secrets.RELEASE_PRIVATE_KEY.

  notify:
    name: Notify verified and accepted release
    needs: [verify, accept-published]
    if: >-
      github.event_name == 'release' && needs.verify.result == 'success' &&
      needs.accept-published.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Prepare release notification
        env:
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg version "$RELEASE_VERSION" \
            '{channel: $channel, text: (".NET SDK " + $version + " is available on NuGet: <https://www.nuget.org/packages/RudderAnalytics/" + $version + "|RudderAnalytics " + $version + ">\n<https://github.com/rudderlabs/rudder-sdk-.net/releases/tag/v" + $version + "|Release notes>\nCC: <!subteam^S03SW7DM8P3>"), unfurl_links: false, unfurl_media: false}' \
            > "$RUNNER_TEMP/nuget-release-notification.json"

      - name: Notify Slack of verified and accepted NuGet publication
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          retries: rapid
          payload-file-path: ${{ runner.temp }}/nuget-release-notification.json
