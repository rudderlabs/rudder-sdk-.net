version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
      exclude: ["rudderlabs/*"]
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
      github-actions-updates:
        patterns: ["*"]
    labels: ["dependencies", "github-actions"]
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
      nuget-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "dotnet"]
  - package-ecosystem: "docker"
    directory: "/Samples/Sloth.Basic"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
      exclude: ["rudderstack/*"]
    ignore:
      - dependency-name: "rudderstack/*"
    groups:
      docker-updates:
        patterns: ["*"]
    labels: ["dependencies", "docker"]
  - package-ecosystem: "docker"
    directory: "/Samples/Sloth.Enterprise"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
      exclude: ["rudderstack/*"]
    ignore:
      - dependency-name: "rudderstack/*"
    groups:
      docker-updates:
        patterns: ["*"]
    labels: ["dependencies", "docker"]
